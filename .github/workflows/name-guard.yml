name: OLS name guard

# Scans the customer-facing OLS catalogue every 30 minutes for names that must never reach a
# real user: QA/test traces, gibberish, ticket refs, status-in-parens, profanity, duplicates.
#
# Only a PUBLICLY reachable environment can be scanned from a GitHub-hosted runner. The
# pre-prod environment resolves to a private 10.x address behind the org VPN, so it is covered
# by a local scheduled job instead — see tools/name-guard/README.md.
#
# Cost: GitHub-hosted standard runners are free with no minute cap on public repositories,
# which this repo is. Nothing here bills the org.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: 'Send the Discord message even when the scan is clean'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: name-guard
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Scan names
        id: scan
        continue-on-error: true
        env:
          OLS_ORIGIN: ${{ secrets.OLS_TRAINING_ORIGIN }}
          OLS_SSO: ${{ secrets.OLS_TRAINING_SSO }}
          OLS_EMAIL: ${{ secrets.OLS_TRAINING_EMAIL }}
          OLS_PW: ${{ secrets.OLS_TRAINING_PW }}
          OLS_ENV_LABEL: training69
        run: node tools/name-guard/scan.js --json report.json --own

      - name: Notify Discord
        env:
          # posts to the QA channel; the webhook is only a fallback if the channel post fails
          DISCORD_BOT_TOKEN: ${{ secrets.OLS_DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.OLS_DISCORD_CHANNEL_ID }}
          DISCORD_WEBHOOK: ${{ secrets.OLS_NAME_GUARD_WEBHOOK }}
          FORCE_NOTIFY: ${{ inputs.force_notify }}
        run: |
          if [ "$FORCE_NOTIFY" = "true" ]; then
            node tools/name-guard/notify.js report.json --force
          else
            node tools/name-guard/notify.js report.json
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: name-guard-report
          path: report.json
          retention-days: 14

      # A scan that could not run is a silent failure if it stays green — fail loudly.
      # Findings alone do not fail the run; the Discord alert carries them.
      - name: Fail when the scan itself could not run
        if: steps.scan.outcome == 'failure'
        run: |
          node -e '
            const r = require("./report.json");
            if (r.ok) { console.log("scan ran; findings:", r.findings.length); process.exit(0); }
            console.error("scan could not run:", r.error);
            process.exit(1);
          '
