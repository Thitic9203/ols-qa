name: Auto Version Bump

# A release tag is a promise that the tagged tree passed the test suite: every session's
# auto-update (scripts/ols-qa-auto-update.sh) moves clones to the newest tag and nothing else.
# So this runs only after the `tests` workflow finished green on a push to main — never on the
# push itself, where the tag used to land while tests were still running or already red.
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]

# One release at a time: two green runs finishing together must not race for the same number.
concurrency:
  group: auto-version
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      !contains(github.event.workflow_run.head_commit.message, '[skip ci]')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0     # full history: the release-diff check below compares against the last tag
          fetch-tags: true   # needed so the duplicate-tag guard can see existing tags

      - name: Release only the commit the tests passed on
        id: gate
        env:
          TESTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # Tag what was tested, nothing else. If main has moved past the tested commit, the
          # newer commit has its own tests run, and that run's completion releases it (including
          # this commit's changes) — tagging main's tip here would release untested code.
          if [ "$(git rev-parse HEAD)" != "$TESTED" ]; then
            echo "::notice::main moved past ${TESTED} — its own tests run will release it."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Replaces the old `paths-ignore: README.md`: nothing to release when everything since
          # the newest release tag (numeric order — v1.49.x sorts after v1.9.x) is README only.
          LAST=$(git tag -l 'v*' | sed -n 's/^v\([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          if [ -n "$LAST" ]; then
            CHANGED=$(git diff --name-only "v${LAST}" HEAD | grep -vx 'README.md' || true)
            if [ -z "$CHANGED" ]; then
              echo "::notice::only README.md changed since v${LAST} — nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Compute new version
        if: steps.gate.outputs.release == 'true'
        id: ver
        env:
          # Never interpolate a commit message into the shell — it is attacker-controlled
          # and this job holds contents:write. Pass it through the environment instead.
          MSG: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          set -euo pipefail

          # Conventional-commit prefix lives on the subject line only;
          # a "feat:" inside the body must not bump minor.
          # Pure-bash slice — no pipe, so pipefail cannot trip on SIGPIPE.
          SUBJECT=${MSG%%$'\n'*}

          if [[ "$MSG" == *"BREAKING CHANGE"* ]]; then
            BUMP=major
          elif [[ "$SUBJECT" =~ ^feat(\(.*\))?!?: ]]; then
            BUMP=minor
          else
            BUMP=patch
          fi

          # Read current version from README header (-m1 stops grep itself, no SIGPIPE)
          CURRENT=$(grep -m1 -oP '(?<=version: v)\d+\.\d+\.\d+' README.md || true)
          if [ -z "$CURRENT" ]; then
            echo "::error::No 'version: vX.Y.Z' header found in README.md — cannot bump."
            exit 1
          fi
          IFS='.' read -r MAJ MIN PAT <<< "$CURRENT"

          case "$BUMP" in
            major) MAJ=$((MAJ+1)); MIN=0; PAT=0 ;;
            minor) MIN=$((MIN+1)); PAT=0 ;;
            patch) PAT=$((PAT+1)) ;;
          esac

          NEW="$MAJ.$MIN.$PAT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "new=$NEW"         >> "$GITHUB_OUTPUT"
          echo "Bump: $BUMP  $CURRENT → $NEW"

      - name: Update README version header
        if: steps.gate.outputs.release == 'true'
        env:
          OLD: ${{ steps.ver.outputs.current }}
          NEW: ${{ steps.ver.outputs.new }}
        run: |
          set -euo pipefail
          DATE=$(date +"%-d %b %Y")
          sed -i "s/\*\*OLS Workspace version: v${OLD}\*\* ([^)]*)/\*\*OLS Workspace version: v${NEW}\*\* (${DATE})/" README.md
          # `cmd && { exit 1; }` would abort the step under `set -e` when cmd exits 1.
          if git diff --quiet -- README.md; then
            echo "::error::README version header did not change (expected v${OLD})."
            exit 1
          fi

      - name: Commit and tag
        if: steps.gate.outputs.release == 'true'
        env:
          NEW: ${{ steps.ver.outputs.new }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/v${NEW}" >/dev/null; then
            echo "::error::Tag v${NEW} already exists — refusing to overwrite."
            exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(release): bump version to v${NEW} [skip ci]"
          git tag "v${NEW}"
          # main first: if it moved since checkout the push is rejected, the job fails and no
          # tag is pushed. The bump commit carries [skip ci], so tests.yml does not run on it
          # and cannot re-trigger this workflow; its tree is the tested tree plus README.
          git push origin main
          git push origin "v${NEW}"
